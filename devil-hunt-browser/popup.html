<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font-family: system-ui, sans-serif; width: 280px; margin: 0; padding: 12px; background: #0f172a; color: #e2e8f0; }
    h1 { font-size: 14px; margin: 0 0 8px; color: #fb7185; }
    .row { display: flex; justify-content: space-between; font-size: 12px; margin: 4px 0; }
    .muted { color: #94a3b8; }
    .ok { color: #34d399; }
    .bad { color: #f87171; }
    .warn { color: #fbbf24; }
    button { width: 100%; margin: 4px 0; padding: 8px; border: none; border-radius: 6px; background: #1e293b; color: #e2e8f0; cursor: pointer; }
    button:hover { background: #334155; }
    button.danger { background: #7f1d1d; }
    .err { font-size: 11px; color: #fca5a5; margin-top: 6px; word-break: break-word; }
  </style>
</head>
<body>
  <h1>DEVIL HUNT SENSOR</h1>
  <div class="row"><span class="muted">Status</span><span id="status" class="bad">DISCONNECTED</span></div>
  <div class="row"><span class="muted">Target</span><span id="target">supplier.meesho.com</span></div>
  <div class="row"><span class="muted">Events sent</span><span id="events">0</span></div>
  <div class="row"><span class="muted">Last event</span><span id="last">—</span></div>
  <div class="row"><span class="muted">Paused</span><span id="paused">no</span></div>
  <button id="connect">CONNECT</button>
  <button id="disconnect" class="danger">DISCONNECT</button>
  <button id="pause">PAUSE</button>
  <button id="resume">RESUME</button>
  <div class="err" id="err"></div>
  <script src="popup.js"></script>
</body>
</html>
